<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>Barkyard Birds - Graphics</title>

	<style type="text/css">
		#thumbs,
		#image {
			width: 900px;
			text-align: center;
			margin: 0 auto 0 auto;
			color: #000;
		}

		#thumbs {
			margin-top: 10px;
		}


		#thumbs img {
			border: solid 1px #000;
			margin: 5px;
		}

		#image {
			height: 500px;
		}

		.instructions {
			font-style: italic;
		}
	</style>

	<script language="JavaScript" type="text/javascript">

		PrintButton1 = new Image
		PrintButton2 = new Image
		logo1 = new Image
		logo2 = new Image
		if (document.images) {
			PrintButton1.src = "images/Print1.png"
			PrintButton2.src = "images/Print2.png"
			logo1.src = "images/BirdLogo.png"
			logo2.src = "images/BirdLogoAlt.png"
		}


		var imgArray = new Array(
			'image1lg.jpg',
			'image2lg.jpg',
			'image3lg.jpg',
			'image4lg.jpg'


		);


		var titleArray = new Array(
			'American Goldfinch',
			'Mountain Bluebird',
			'Hummingbird',
			'Cardinal'

		);

		var imgPath = "images/fullsize/";

		function swapImage(imgID) {

			var theImage = document.getElementById('theImage');
			var textDiv = document.getElementById('bottomText');

			var newImg;
			var textTitle;

			newImg = imgArray[imgID];
			theImage.src = imgPath + newImg;

			textTitle = titleArray[imgID];

			textDiv.innerHTML = textTitle;
		}

		function preloadImages() {
			for (var i = 0; i < imgArray.length; i++) {
				var tmpImg = new Image;
				tmpImg.src = imgPath + imgArray[i];
			}
		}


	</script>


</head>

<body onload="preloadImages()">

	<div style="text-align: center;">

		<a href="" onmouseover="document.getElementById('print').src='Images/Print2.png';"
			onmouseout="document.getElementById('print').src='images/Print1.png';">

			<img src="images/print1.png" alt="Print Page" width="200" height="50" id="print"></a>

	</div>


	<div style="text-align: center;">

		<a href="" onmouseover="document.getElementById('logo').src='images/BirdLogoAlt.png';"
			onmouseout="document.getElementById('logo').src='images/BirdLogo.png';">

			<img src="images/BirdLogo.png" alt="Logo" id="logo"></a>

	</div>

	<br />
	<br />
	<br />
	<br />


	<div id="thumbs">
		<img src="images/thumbnails/image1sm.jpg" alt="American Goldfinch" onmouseover="swapImage(0);" />
		<img src="images/thumbnails/image2sm.jpg" alt="Mountain Bluebird" onmouseover="swapImage(1);" />
		<img src="images/thumbnails/image3sm.jpg" alt="Hummingbird" onmouseover="swapImage(2);" />
		<img src="images/thumbnails/image4sm.jpg" alt="Cardinal" onmouseover="swapImage(3);" />

	</div>

	<div id="image">

		<img id="theImage" src="Images/fullSize/image1lg.jpg" alt="American Goldfinch" />
		<h3 id="bottomText">American Goldfinch</h3>
	</div>

<img src="images/2colback.jpg" alt="Background">

	<br />
	<br />
	<br />
	<br />

	<p>
		<a href="http://validator.w3.org/check?uri=referer"><img src="http://www.w3.org/Icons/valid-xhtml10"
				alt="Valid XHTML 1.0 Transitional" height="31" width="88" /></a>
	</p>


</body>

</html>
